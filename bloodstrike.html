<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blood Strike Top Up | LAKIYA STORE</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#000;color:#fff;padding-bottom:100px;}

.top-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;background:#000;border-bottom:2px solid #1a1a1a;position:sticky;top:0;z-index:10;}
.logo-left{display:flex;align-items:center;gap:10px;}
.logo-icon{width:42px;height:42px;background:#111;border-radius:10px;overflow:hidden;border:1.5px solid #222;}
.logo-icon img{width:100%;height:100%;object-fit:cover;}
.store-title{font-size:18px;font-weight:900;color:#fff;}
.store-title span{color:#ff0000;}

.game-header{display:flex;gap:15px;align-items:center;padding:15px;background:linear-gradient(180deg, #111, #000);border-bottom:1px solid #1a1a1a;}
.game-header img{width:80px;height:80px;border-radius:16px;object-fit:cover;border:2px solid #ff0000;box-shadow:0 0 15px rgba(255,0,0,0.3);}
.game-info h1{font-size:22px;font-weight:800;}
.game-info p{font-size:12px;color:#aaa;margin-top:2px;display:flex;align-items:center;gap:5px;}
.game-info p::before{content:"✔";color:#00ff00;font-weight:800;}
.game-info p:nth-child(3)::before{content:"⚡";color:#ffcc00;}

.container{max-width:700px;margin:0 auto;padding:0 12px;}

/* ID BOX */
.id-section{background:#0e0e0e;border:1.5px solid #222;border-radius:18px;padding:18px 15px;margin:15px 0;}
.id-title{color:#ff0000;font-size:18px;font-weight:800;margin-bottom:12px;}
.id-input-wrap{display:flex;gap:8px;}
.id-input-wrap input{flex:1;background:#1a1a1a;border:1.5px solid #333;border-radius:12px;padding:12px 15px;color:#fff;font-size:14px;outline:none;text-align:center;}
.id-input-wrap input:focus{border-color:#ff0000;}
.verify-btn{background:linear-gradient(90deg, #ff0000, #cc0000);border:none;padding:12px 18px;border-radius:12px;color:#fff;font-weight:800;font-size:13px;cursor:pointer;}
.verify-result{margin-top:10px;font-size:13px;font-weight:700;color:#00ff88;display:none;background:#002a14;padding:8px 12px;border-radius:10px;border:1px solid #00ff88;}

.section-title{font-size:16px;font-weight:700;color:#ccc;margin:15px 0 10px 5px;}

/* PACKS GRID - 2 COLS */
.grid{display:grid;grid-template-columns:repeat(2, 1fr);gap:12px;}
.pack-card{background:#111;border:1.5px solid #222;border-radius:16px;padding:10px 8px;text-align:center;position:relative;transition:0.2s;}
.pack-card.selected{border-color:#ff0000;box-shadow:0 0 18px rgba(255,0,0,0.3);background:#1a0a0a;}
.pack-img{width:60px;height:60px;object-fit:cover;border-radius:10px;margin:0 auto 8px auto;display:block;background:#000;border:1px solid #222;}
.pack-name{font-size:12px;font-weight:700;min-height:36px;display:flex;align-items:center;justify-content:center;line-height:1.2;color:#fff;}
.price-pill{background:linear-gradient(90deg, #1a1a1a, #222);border:1px solid #333;border-radius:20px;padding:5px 0;margin:8px 0;font-size:13px;font-weight:600;color:#aaa;}
.price-pill span{color:#ffcc00;font-weight:800;font-size:14px;}
.add-btn{width:100%;background:#000;border:1.5px solid #333;padding:7px 0;border-radius:10px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:0.2s;}
.pack-card.selected.add-btn{background:linear-gradient(90deg, #ff0000, #990000);border-color:#ff0000;}

.qty-wrap{display:none;justify-content:space-between;align-items:center;background:#000;border:1px solid #ff0000;border-radius:10px;margin-top:8px;overflow:hidden;}
.pack-card.selected.qty-wrap{display:flex;}
.qty-btn{width:38px;height:32px;background:#ff0000;border:none;color:#fff;font-size:18px;font-weight:800;cursor:pointer;}
.qty-num{flex:1;text-align:center;font-weight:800;font-size:14px;}

/* CHECKOUT BAR */
.checkout-bar{position:fixed;bottom:0;left:0;width:100%;background:#111;border-top:2px solid #ff0000;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;z-index:99;}
.total{font-size:14px;color:#aaa;}
.total span{color:#fff;font-size:18px;font-weight:900;}
.next-btn{background:linear-gradient(90deg, #ff0000, #cc0000);border:none;padding:12px 30px;border-radius:25px;color:#fff;font-weight:900;font-size:14px;cursor:pointer;box-shadow:0 4px 15px rgba(255,0,0,0.4);opacity:0.5;pointer-events:none;}
.next-btn.active{opacity:1;pointer-events:auto;}
</style>
</head>
<body>

<div class="top-bar">
<div class="logo-left">
<div class="logo-icon"><img src="3ec4791e-5aa7-496d-9de4-083e6188c99d.jpeg"></div>
<div class="store-title">LAKIYA <span>STORE</span></div>
</div>
<a href="index.html" style="color:#fff;text-decoration:none;font-size:12px;font-weight:700;border:1px solid #333;padding:6px 14px;border-radius:20px;">BACK</a>
</div>

<div class="game-header container">
<img src="bloodstrike-logo.jpg" alt="Blood Strike" onerror="this.src='https://i.imgur.com/8Km9tLL.png'">
<div class="game-info">
<h1>Blood Strike</h1>
<p> Safety guarantee</p>
<p> Instant Delivery</p>
</div>
</div>

<div class="container">
<div class="id-section">
<div class="id-title">Enter the User ID</div>
<div class="id-input-wrap">
<input type="text" id="userId" placeholder="Enter User ID">
<button class="verify-btn" onclick="verifyId()">VERIFY</button>
</div>
<div id="verifyResult" class="verify-result"></div>
</div>

<div class="section-title">Other</div>

<div class="grid" id="packGrid"></div>
</div>

<div class="checkout-bar">
<div class="total">Total: <span id="totalPrice">Rs. 0</span><br><span id="totalItems" style="font-size:11px;color:#aaa;font-weight:500;">0 Items selected</span></div>
<button class="next-btn" id="nextBtn" onclick="goToPayment()">NEXT →</button>
</div>

<script>
// PACKS - UBA PHOTO FILE NAM EKA DAPANNA
// img = ubata one photo eka
const packs = [
{ id:1, name:"Level-Up Pass", price:680, img:"levelup.jpg" },
{ id:2, name:"Strike Pass Elite", price:1365, img:"elite.jpg" },
{ id:3, name:"Strike Pass Premium", price:3080, img:"premium.jpg" },
{ id:4, name:"Ultra Skin Lucky Chest", price:190, img:"ultra.jpg" },
{ id:5, name:"50 + 6 Golds", price:150, img:"golds.jpg" },
{ id:6, name:"100 + 16 Golds", price:300, img:"golds.jpg" },
{ id:7, name:"300 + 52 Golds", price:900, img:"golds.jpg" },
{ id:8, name:"500 + 94 Golds", price:1500, img:"golds.jpg" },
{ id:9, name:"1000 + 210 Golds", price:3000, img:"golds.jpg" },
{ id:10, name:"2000 + 486 Golds", price:5990, img:"golds.jpg" },
{ id:11, name:"5000 + 1380 Golds", price:14950, img:"golds.jpg" },
];

const grid = document.getElementById('packGrid');
let cart = {}; // id -> qty
let verifiedName = "";

packs.forEach(p=>{
grid.innerHTML += `
<div class="pack-card" id="pack-${p.id}">
<img class="pack-img" src="${p.img}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/100/111/ff0000?text=GOLD'">
<div class="pack-name">${p.name}</div>
<div class="price-pill">Rs. <span>${p.price}</span></div>
<button class="add-btn" onclick="addPack(${p.id})">Add</button>
<div class="qty-wrap">
<button class="qty-btn" onclick="changeQty(${p.id}, -1)">−</button>
<div class="qty-num" id="qty-${p.id}">0</div>
<button class="qty-btn" onclick="changeQty(${p.id}, 1)">+</button>
</div>
</div>
`;
});

function verifyId(){
  const id = document.getElementById('userId').value.trim();
  const res = document.getElementById('verifyResult');
  if(!id){ alert("ID eka danna bn!"); return; }
  // FAKE VERIFY - API thiyenawa nam me thana link karanna
  res.style.display = "block";
  res.innerHTML = "Checking...";
  setTimeout(()=>{
    verifiedName = "Player_" + id.substring(0,4) + " ✓ Verified";
    res.innerHTML = "✅ Game Name: <b style='color:#fff'>" + verifiedName + "</b>";
  }, 800);
}

function addPack(id){
  if(!cart[id]) cart[id]=0;
  cart[id]++;
  updateCard(id);
  updateTotal();
}

function changeQty(id, delta){
  cart[id] = (cart[id]||0) + delta;
  if(cart[id] <=0){ delete cart[id]; }
  updateCard(id);
  updateTotal();
}

function updateCard(id){
  const card = document.getElementById(`pack-${id}`);
  const qtyEl = document.getElementById(`qty-${id}`);
  if(cart[id]){
    card.classList.add('selected');
    qtyEl.textContent = cart[id];
  } else {
    card.classList.remove('selected');
    qtyEl.textContent = "0";
  }
}

function updateTotal(){
  let total = 0; let items = 0;
  for(let id in cart){
    let pack = packs.find(p=>p.id==id);
    total += pack.price * cart[id];
    items += cart[id];
  }
  document.getElementById('totalPrice').textContent = "Rs. " + total;
  document.getElementById('totalItems').textContent = items + " Items selected";
  const btn = document.getElementById('nextBtn');
  if(items>0){ btn.classList.add('active'); } else { btn.classList.remove('active'); }
}

function goToPayment(){
  const uid = document.getElementById('userId').value.trim();
  if(!uid){ alert("User ID eka danna bn!"); return; }
  if(Object.keys(cart).length===0){ alert("Pack ekak select karanna bn!"); return; }

  let orderItems = [];
  for(let id in cart){
    let p = packs.find(x=>x.id==id);
    orderItems.push({ name:p.name, price:p.price, qty:cart[id] });
  }
  localStorage.setItem('lakiya_order', JSON.stringify({
    game:"Blood Strike",
    userId: uid,
    gameName: verifiedName,
    items: orderItems,
    total: document.getElementById('totalPrice').textContent
  }));
  window.location.href = "payment.html";
}
</script>

</body>
</html>
