<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUBG Mobile | LAKIYA STORE</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#000;color:#fff;min-height:100vh;padding-bottom:110px;}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;background:#000;border-bottom:2px solid #1a1a1a;position:sticky;top:0;z-index:20;}
.logo-left{display:flex;align-items:center;gap:10px;}
.logo-icon{width:42px;height:42px;background:#111;border-radius:10px;overflow:hidden;border:1.5px solid #222;}
.logo-icon img{width:100%;height:100%;object-fit:cover;}
.store-title{font-size:18px;font-weight:900;color:#fff;}
.store-title span{color:#ff0000;}
.container{max-width:700px;margin:0 auto;padding:0 12px;}
.game-header{display:flex;gap:14px;align-items:center;padding:15px 0 10px 0;}
.game-logo{width:82px;height:82px;border-radius:18px;overflow:hidden;border:2px solid #ff0000;background:#111;flex-shrink:0;box-shadow:0 0 20px rgba(255,0,0,0.25);}
.game-logo img{width:100%;height:100%;object-fit:cover;display:block;}
.game-info h1{font-size:23px;font-weight:800;line-height:1.1;}
.game-info p{font-size:12px;color:#bbb;margin-top:4px;}
.id-box{background:#0e0e0e;border:1.5px solid #222;border-radius:20px;padding:18px 15px;margin:10px 0 15px 0;}
.id-label{color:#ff0000;font-size:17px;font-weight:800;margin-bottom:12px;}
.id-row{display:flex;gap:8px;margin-bottom:10px;}
.id-row input{flex:1;background:#1a1a1a;border:1.5px solid #333;border-radius:12px;padding:13px 15px;color:#fff;font-size:14px;outline:none;text-align:center;}
.id-row input:focus{border-color:#ff0000;}
.section-title{font-size:14px;font-weight:600;color:#888;margin:18px 0 12px 5px;}
.grid{display:grid;grid-template-columns:repeat(2, 1fr);gap:12px;}
.pack{background:#111;border:1.5px solid #222;border-radius:16px;padding:12px 8px;text-align:center;transition:0.2s;}
.pack.selected{border-color:#ff0000;background:#1a0f0f;box-shadow:0 0 15px rgba(255,0,0,0.2);}
.pack-img{width:64px;height:64px;object-fit:cover;border-radius:12px;margin:0 auto 8px auto;display:block;background:#000;border:1px solid #222;}
.pack-name{font-size:12px;font-weight:700;min-height:34px;display:flex;align-items:center;justify-content:center;color:#fff;line-height:1.2;}
.pack-price{margin:8px 0;background:#000;border:1px solid #222;border-radius:20px;padding:5px 0;font-size:12px;color:#aaa;}
.pack-price span{color:#ffcc00;font-weight:800;font-size:14px;}
.qty{display:flex;justify-content:space-between;align-items:center;background:#000;border:1.5px solid #333;border-radius:10px;margin-top:8px;overflow:hidden;}
.qbtn{width:42px;height:36px;background:#1a1a1a;border:none;color:#fff;font-size:20px;font-weight:800;cursor:pointer;}
.qbtn:active{transform:scale(0.9);}
.qnum{flex:1;text-align:center;font-weight:800;font-size:15px;color:#fff;}
.checkout{position:fixed;bottom:0;left:0;width:100%;background:#111;border-top:2px solid #ff0000;padding:12px 15px;display:none;justify-content:space-between;align-items:center;z-index:99;}
.checkout.show{display:flex;}
.total{font-size:12px;color:#aaa;}
.total b{color:#fff;font-size:18px;}
.next-btn{background:linear-gradient(90deg, #ff0000, #cc0000);border:none;padding:12px 28px;border-radius:25px;color:#fff;font-weight:900;font-size:14px;cursor:pointer;box-shadow:0 5px 20px rgba(255,0,0,0.4);}
</style>
</head>
<body>
<div class="top-bar"><div class="logo-left"><div class="logo-icon"><img src="3ec4791e-5aa7-496d-9de4-083e6188c99d.jpeg"></div><div class="store-title">LAKIYA <span>STORE</span></div></div><a href="index.html" style="color:#fff;text-decoration:none;font-size:11px;font-weight:700;border:1px solid #333;padding:6px 14px;border-radius:20px;">BACK</a></div>
<div class="container">
<div class="game-header"><div class="game-logo"><img src="82a99d7e-69c5-4042-96bb-ff8a98d79fdd.jpeg" onerror="this.src='14ebaa08-628e-45d8-b5f3-57cde9450ed4.jpeg"></div><div class="game-info"><h1>PUBG Mobile</h1><p>✔ Safety guarantee</p><p>⚡ Instant Delivery</p></div></div>
<div class="id-box"><div class="id-label">Enter the User ID</div><div class="id-row"><input type="text" id="uid" placeholder="Enter User ID"></div></div>
<div class="section-title">Other</div><div class="grid" id="grid"></div>
</div>
<div class="checkout" id="checkout"><div class="total">TOTAL<br><b id="tPrice">Rs. 0</b><br><span id="tCount" style="font-size:11px;">0 items</span></div><button class="next-btn" onclick="goPay()">NEXT →</button></div>
<script>
const packs = [
{ id:1, name:"RP Upgrade Pack", price:3350, img:"pubg_rp.jpg" },
{ id:2, name:"Elite RP Upgrade Pack", price:9190, img:"pubg_elite_rp.jpg" },
{ id:3, name:"60 UC", price:335, img:"pubg_60uc.jpg" },
{ id:4, name:"325 UC", price:1650, img:"pubg_325uc.jpg" },
{ id:5, name:"660 UC", price:3380, img:"pubg_660uc.jpg" },
{ id:6, name:"1800 UC", price:8320, img:"pubg_1800uc.jpg" },
{ id:7, name:"3850 UC", price:16600, img:"pubg_3850uc.jpg" },
{ id:8, name:"8100 UC", price:33050, img:"pubg_8100uc.jpg" },
];
const grid = document.getElementById('grid'); let cart = {};
packs.forEach(p=>{ grid.innerHTML += `<div class="pack" id="pack-${p.id}"><img class="pack-img" src="${p.img}" onerror="this.src='https://via.placeholder.com/100x100/111/ff0000?text=PUBG'"><div class="pack-name">${p.name}</div><div class="pack-price">Rs. <span>${p.price}</span></div><div class="qty"><button class="qbtn" onclick="chg(${p.id}, -1)">−</button><div class="qnum" id="q-${p.id}">0</div><button class="qbtn" onclick="chg(${p.id}, 1)">+</button></div></div>`; });
function chg(id, d){
  cart[id] = (cart[id]||0) + d; if(cart[id] < 0) cart[id]=0; if(cart[id]==0) delete cart[id];
  document.getElementById(`q-${id}`).textContent = cart[id] || 0;
  const el = document.getElementById(`pack-${id}`); if(cart[id]) el.classList.add('selected'); else el.classList.remove('selected');
  calc();
}
function calc(){
  let total=0, count=0; for(let id in cart){ let p = packs.find(x=>x.id==id); total += p.price * cart[id]; count += cart[id]; }
  document.getElementById('tPrice').textContent = "Rs. " + total;
  document.getElementById('tCount').textContent = count + " items selected";
  const co = document.getElementById('checkout'); if(count>0) co.classList.add('show'); else co.classList.remove('show');
}
function goPay(){
  const uid = document.getElementById('uid').value.trim();
  if(!uid){ alert("User ID eka danna bn!"); return; }
  let items=[]; for(let id in cart){ let p=packs.find(x=>x.id==id); items.push({name:p.name, price:p.price, qty:cart[id], total: p.price * cart[id]}); }
  if(items.length==0){ alert("Pack ekak thoranna bn!"); return; }
  // FIXED - vName error ain kala
  localStorage.setItem('lakiya_order', JSON.stringify({
    game:"PUBG Mobile",
    userId:uid,
    gameName: "",
    items:items,
    totalText: document.getElementById('tPrice').textContent
  }));
  window.location.href="payment.html";
}
</script>
</body>
</html>
