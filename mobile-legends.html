<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Legends | LAKIYA STORE</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#000;color:#fff;padding-bottom:110px;}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;background:#000;border-bottom:2px solid #1a1a1a;position:sticky;top:0;z-index:20;}
.logo-left{display:flex;align-items:center;gap:10px;}
.logo-icon{width:42px;height:42px;background:#111;border-radius:10px;overflow:hidden;border:1.5px solid #222;}
.logo-icon img{width:100%;height:100%;object-fit:cover;}
.store-title{font-size:18px;font-weight:900;}.store-title span{color:#ff0000;}
.container{max-width:700px;margin:0 auto;padding:0 12px;}
.game-header{display:flex;gap:14px;align-items:center;padding:15px 0;}
.game-logo{width:82px;height:82px;border-radius:18px;overflow:hidden;border:2px solid #ff0000;background:#111;box-shadow:0 0 20px rgba(255,0,0,0.25);}
.game-logo img{width:100%;height:100%;object-fit:cover;}
.game-info h1{font-size:22px;font-weight:800;}.game-info p{font-size:12px;color:#bbb;margin-top:4px;}
.id-box{background:#0e0e0e;border:1.5px solid #222;border-radius:20px;padding:18px 15px;margin:10px 0;}
.id-label{color:#ff0000;font-size:17px;font-weight:800;margin-bottom:12px;}
.id-row{display:flex;gap:8px;margin-bottom:10px;}
.id-row input{flex:1;background:#1a1a1a;border:1.5px solid #333;border-radius:12px;padding:13px 15px;color:#fff;text-align:center;outline:none;}
.verify-btn{width:100%;background:linear-gradient(90deg, #00c853, #009624);border:none;padding:13px 20px;border-radius:12px;color:#fff;font-weight:800;cursor:pointer;}
.verified-card{display:none;background:linear-gradient(135deg, #0a1a0a, #111);border:1.5px solid #00ff88;border-radius:14px;padding:12px 14px;align-items:center;gap:12px;margin-top:12px;}
.verified-card.show{display:flex;}
.verified-icon{width:42px;height:42px;background:#00ff88;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;}
.v1{color:#00ff88;font-size:12px;font-weight:800;}.v2{color:#fff;font-size:14px;font-weight:700;}.v3{color:#aaa;font-size:11px;}
.section-title{font-size:16px;font-weight:800;color:#fff;margin:20px 0 12px 5px;display:flex;gap:6px;align-items:center;}
.grid{display:grid;grid-template-columns:repeat(2, 1fr);gap:12px;}
.pack{background:#111;border:1.5px solid #222;border-radius:16px;padding:12px 8px;text-align:center;transition:0.2s;}
.pack.selected{border-color:#ff0000;background:#1a0f0f;box-shadow:0 0 15px rgba(255,0,0,0.2);}
.pack-img{width:64px;height:64px;object-fit:cover;border-radius:12px;margin:0 auto 8px auto;display:block;background:#000;border:1px solid #222;}
.pack-name{font-size:12px;font-weight:700;min-height:34px;display:flex;align-items:center;justify-content:center;}
.pack-price{margin:8px 0;background:#000;border:1px solid #222;border-radius:20px;padding:5px 0;font-size:12px;color:#aaa;}
.pack-price span{color:#ffcc00;font-weight:800;font-size:14px;}
.qty{display:flex;justify-content:space-between;align-items:center;background:#000;border:1.5px solid #333;border-radius:10px;margin-top:8px;overflow:hidden;}
.pack.selected.qty{border-color:#ff0000;}
.qbtn{width:42px;height:36px;background:#1a1a1a;border:none;color:#fff;font-size:20px;font-weight:800;cursor:pointer;}
.pack.selected.qbtn{background:#ff0000;}
.qnum{flex:1;text-align:center;font-weight:800;font-size:15px;}
.checkout{position:fixed;bottom:0;left:0;width:100%;background:#111;border-top:2px solid #ff0000;padding:12px 15px;display:none;justify-content:space-between;align-items:center;z-index:99;}
.checkout.show{display:flex;}
.next-btn{background:linear-gradient(90deg, #ff0000, #cc0000);border:none;padding:12px 28px;border-radius:25px;color:#fff;font-weight:900;cursor:pointer;}
</style>
</head>
<body>
<div class="top-bar"><div class="logo-left"><div class="logo-icon"><img src="3ec4791e-5aa7-496d-9de4-083e6188c99d.jpeg"></div><div class="store-title">LAKIYA <span>STORE</span></div></div><a href="index.html" style="color:#fff;text-decoration:none;font-size:11px;border:1px solid #333;padding:6px 14px;border-radius:20px;">BACK</a></div>
<div class="container">
<div class="game-header"><div class="0b550e8d-c7f4-4e3c-abb0-f571f494948d.jpeg"><img src="ml-icon.jpg" onerror="this.src='mlbb.jpg'"></div><div class="game-info"><h1>Mobile Legends</h1><p>✔ Safety guarantee</p><p>⚡ Instant Delivery</p></div></div>
<div class="id-box">
<div class="id-label">Enter the User ID</div>
<div class="id-row"><input type="text" id="uid" placeholder="Enter User ID"></div>
<div class="id-row"><input type="text" id="zid" placeholder="Enter Zone ID"></div>
<button class="verify-btn" onclick="verifyID()">Check Username</button>
<div id="vCard" class="verified-card"><div class="verified-icon">✓</div><div><div class="v1">ID VERIFIED</div><div class="v2" id="vName">ML Player</div><div class="v3" id="vId">ID: </div></div></div>
</div>

<div class="section-title">⭐ Top Selling</div>
<div class="grid" id="gridTop"></div>

<div class="section-title">Other</div>
<div class="grid" id="gridOther"></div>
</div>

<div class="checkout" id="checkout"><div>TOTAL<br><b id="tPrice">Rs. 0</b><br><span id="tCount" style="font-size:11px;">0 items</span></div><button class="next-btn" onclick="goPay()">NEXT →</button></div>

<script>
const topPacks=[
{name:"Weekly",price:570,img:"ml_weekly.jpg"},
{name:"Weekly x3",price:1670,img:"ml_weeklyx3.jpg"},
{name:"Weekly x4",price:2220,img:"ml_weeklyx4.jpg"},
{name:"Weekly x5",price:2800,img:"ml_weeklyx5.jpg"},
{name:"257 💎 +Weekly",price:1880,img:"ml_257weekly.jpg"},
{name:"Twillpass",price:2990,img:"ml_twilight.jpg"},
];

const otherPacks=[
{name:"86 Diamond",price:460,img:"ml_dia.jpg"},
{name:"172 Diamond",price:910,img:"ml_dia.jpg"},
{name:"257 Diamond",price:1320,img:"ml_dia.jpg"},
{name:"344 Diamond",price:1625,img:"ml_dia.jpg"},
{name:"429 Diamond",price:2030,img:"ml_dia.jpg"},
{name:"514 Diamond",price:2400,img:"ml_dia.jpg"},
{name:"600 Diamond",price:2830,img:"ml_dia.jpg"},
{name:"706 Diamond",price:3750,img:"ml_dia.jpg"},
{name:"878 Diamond",price:3560,img:"ml_dia.jpg"},
{name:"963 Diamond",price:4470,img:"ml_dia.jpg"},
{name:"1050 Diamond",price:4810,img:"ml_dia.jpg"},
{name:"1412 Diamond",price:6430,img:"ml_dia.jpg"},
{name:"1584 Diamond",price:7250,img:"ml_dia.jpg"},
{name:"1756 Diamond",price:8030,img:"ml_dia.jpg"},
{name:"2195 Diamond",price:10790,img:"ml_dia.jpg"},
{name:"2539 Diamond",price:11250,img:"ml_dia.jpg"},
{name:"2901 Diamond",price:12850,img:"ml_dia.jpg"},
{name:"3688 Diamond",price:18000,img:"ml_dia.jpg"},
{name:"4394 Diamond",price:19300,img:"ml_dia.jpg"},
{name:"5100 Diamond",price:22500,img:"ml_dia.jpg"},
{name:"5532 Diamond",price:27150,img:"ml_dia.jpg"},
{name:"6238 Diamond",price:27500,img:"ml_dia.jpg"},
{name:"7727 Diamond",price:34000,img:"ml_dia.jpg"},
{name:"8433 Diamond",price:37190,img:"ml_dia.jpg"},
{name:"9288 Diamond",price:45150,img:"ml_dia.jpg"},
{name:"10080 Diamond",price:44000,img:"ml_dia.jpg"},
{name:"10700 Diamond",price:46800,img:"ml_dia.jpg"},
{name:"11483 Diamond",price:47450,img:"ml_dia.jpg"},
{name:"12189 Diamond",price:50450,img:"ml_dia.jpg"},
{name:"15526 Diamond",price:64350,img:"ml_dia.jpg"},
];

let cart={}; let idCounter=0;
function renderPacks(list, containerId){
  const cont=document.getElementById(containerId);
  list.forEach(p=>{
    idCounter++;
    p._id=idCounter;
    cont.innerHTML+=`<div class="pack" id="pack-${p._id}"><img class="pack-img" src="${p.img}" onerror="this.src='https://via.placeholder.com/100'"><div class="pack-name">${p.name}</div><div class="pack-price">Rs. <span>${p.price}</span></div><div class="qty"><button class="qbtn" onclick="chg(${p._id},-1)">−</button><div class="qnum" id="q-${p._id}">0</div><button class="qbtn" onclick="chg(${p._id},1)">+</button></div></div>`;
  });
}
renderPacks(topPacks,'gridTop');
renderPacks(otherPacks,'gridOther');

function verifyID(){
  const id=document.getElementById('uid').value.trim();
  const zid=document.getElementById('zid').value.trim();
  if(!id||!zid){alert("User ID & Zone ID danna bn!");return;}
  document.getElementById('vId').textContent="ID: "+id+" ("+zid+")";
  document.getElementById('vName').textContent="IGN: MLPlayer_"+id.slice(-3);
  document.getElementById('vCard').classList.add('show');
}

const allPacks=[...topPacks,...otherPacks];
function chg(id,d){
  cart[id]=(cart[id]||0)+d;
  if(cart[id]<0)cart[id]=0;
  if(cart[id]==0)delete cart[id];
  document.getElementById(`q-${id}`).textContent=cart[id]||0;
  if(cart[id])document.getElementById(`pack-${id}`).classList.add('selected');
  else document.getElementById(`pack-${id}`).classList.remove('selected');
  calc();
}
function calc(){
  let t=0,c=0;
  for(let id in cart){
    let p=allPacks.find(x=>x._id==id);
    t+=p.price*cart[id];c+=cart[id];
  }
  document.getElementById('tPrice').textContent="Rs. "+t;
  document.getElementById('tCount').textContent=c+" items";
  document.getElementById('checkout').classList.toggle('show',c>0);
}
function goPay(){
  const uid=document.getElementById('uid').value.trim();
  const zid=document.getElementById('zid').value.trim();
  if(!uid||!zid){alert("ID tika danna bn!");return;}
  let items=[];
  for(let id in cart){let p=allPacks.find(x=>x._id==id);items.push({name:p.name,price:p.price,qty:cart[id]});}
  if(!items.length){alert("Pack ekak thoranna!");return;}
  localStorage.setItem('lakiya_order',JSON.stringify({game:"Mobile Legends",userId:uid+" ("+zid+")",gameName:document.getElementById('vName').textContent,items:items,total:document.getElementById('tPrice').textContent}));
  location.href="payment.html";
}
</script>
</body>
</html>
